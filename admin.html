<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ya Zol · Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout idea: the organizer's wall chart — two columns, men and women,
   every student a strip coloured by the team the game suggested. */
:root {
  color-scheme: light;
  --wall: #F7F5F0; --ink: #0E0E0C; --red: #D21034; --green: #007229; --ochre: #E9A93A;
  --muted: #5C5A53; --line: rgba(14, 14, 12, .12); --card: #FFFFFF;
  --c-edit: #C77A00; --c-shoot: #2F5BD3; --c-org: #007229; --c-fin: #8A5A00; --c-flag: #D21034;
  --f-display: "Syne", "Arial Black", system-ui, sans-serif;
  --f-body: "Instrument Sans", "IBM Plex Sans Arabic", "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--wall); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.frieze { height: 12px; background:
  conic-gradient(from 135deg at 50% 0, var(--red) 90deg, transparent 0) 0 0 / 12px 6px repeat-x,
  conic-gradient(from -45deg at 50% 100%, var(--ink) 90deg, transparent 0) 0 6px / 12px 6px repeat-x; }
.wrap { max-width: 1240px; margin-inline: auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 22px; }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
h1 { font: 800 clamp(28px, 4vw, 44px)/1 var(--f-display); letter-spacing: -.02em; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 14px; }
.btn--dark { background: var(--ink); color: var(--wall); }
.btn:hover { background: var(--ink); color: var(--wall); }

/* login */
.login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 14px; }
.login input { min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--card); }
.login input:focus { border-color: var(--ink); outline: none; }
.err { color: var(--red); font-size: 14px; min-height: 1.2em; }

/* summary */
.summary { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 18px; }
.summary table { width: 100%; border-collapse: collapse; background: var(--card); font-variant-numeric: tabular-nums; }
.summary th, .summary td { padding: 10px 14px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
.summary thead th { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.summary td.n, .summary th.n { text-align: end; }
.summary tbody tr:last-child td { border-bottom: 0; font-weight: 600; }
.scroll { overflow-x: auto; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 8px; vertical-align: -1px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 38px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--wall); }
.search { flex: 1 1 220px; min-width: 0; min-height: 40px; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 16px; background: var(--card); }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }

/* columns */
.cols { display: grid; gap: 20px; }
@media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }
.col { min-width: 0; }
.col__head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 3px solid var(--ink); margin-bottom: 10px; position: sticky; top: 0; background: var(--wall); z-index: 1; }
.col__head h2 { font: 800 24px/1 var(--f-display); }
.col__head span { color: var(--muted); font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 8px; }
.empty { color: var(--muted); padding: 18px 0; }
.st { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 18px; position: relative; display: grid; gap: 6px; overflow: hidden; }
.st::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--role, var(--muted)); }
.st__top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.st__name { font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.st__meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.st__roles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--role); color: #fff; white-space: nowrap; }
.pill--2 { background: transparent; color: var(--ink); border: 1.5px solid var(--role); }
.org { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: rgba(14, 14, 12, .06); white-space: nowrap; font-variant-numeric: tabular-nums; }
.org--strong { background: var(--ochre); }
.st__extra { font-size: 13px; color: var(--muted); }
.st__extra b { color: var(--ink); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin-top: 26px; }
</style>
</head>
<body>
<div class="frieze" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Sudanese Students · BAU</p>
      <h1>Team results</h1>
    </div>
    <div id="actions" hidden style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn" id="refresh">Refresh</button>
      <button type="button" class="btn" id="logout">Lock</button>
      <a class="btn btn--dark" id="sheet" href="#" target="_blank" rel="noopener">Open Google Sheet</a>
    </div>
  </header>

  <form class="login" id="login">
    <p>Enter the results password.</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button class="btn btn--dark" type="submit" style="justify-content:center;min-height:52px">Show results</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <section id="board" hidden>
    <div class="summary"><div class="scroll"><table>
      <thead><tr><th>Suggested team</th><th class="n">Men</th><th class="n">Women</th><th class="n">Total</th><th class="n">Strong organizers</th></tr></thead>
      <tbody id="sum"></tbody>
    </table></div></div>

    <div class="filters" role="group" aria-label="Filter by team" id="filters"></div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Search name, student number or major" aria-label="Search">
      <label class="toggle"><input type="checkbox" id="strong"> Strong organizers only (5+)</label>
      <select id="sort" class="chip" aria-label="Sort">
        <option value="role">Sort: by team</option>
        <option value="org">Sort: organizer score</option>
        <option value="new">Sort: newest first</option>
        <option value="name">Sort: name A–Z</option>
      </select>
    </div>

    <div class="cols">
      <div class="col"><div class="col__head"><h2>Men</h2><span id="n-m"></span></div><div class="list" id="list-m"></div></div>
      <div class="col"><div class="col__head"><h2>Women</h2><span id="n-f"></span></div><div class="list" id="list-f"></div></div>
    </div>
    <p class="note" id="other"></p>
    <p class="note">Organizer score comes from three hidden situations in the game (0–7). Yellow badge = 5 or more. Second role is shown as an outline.</p>
  </section>
</div>

<script>
(function () {
  "use strict";
  const ROLES = [
    ["Media · Editing", "var(--c-edit)"], ["Media · Shooting", "var(--c-shoot)"], ["Organizers", "var(--c-org)"],
    ["Finance & Sponsors", "var(--c-fin)"], ["Flags", "var(--c-flag)"]
  ];
  const color = (r) => (ROLES.find((x) => x[0] === r) || [0, "var(--muted)"])[1];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let rows = [], key = "", filter = "All";
  try { key = sessionStorage.getItem("zol-key") || ""; } catch (e) {}

  function load(k) {
    $("err").textContent = "";
    const run = window.google && google.script && google.script.run;
    if (!run) { $("err").textContent = "Open this page from the Apps Script link (…/exec?page=admin)."; return; }
    run.withSuccessHandler((res) => {
      if (!res || !res.ok) { try { sessionStorage.removeItem("zol-key"); } catch (e) {} $("err").textContent = res && res.error === "locked" ? "Too many wrong attempts. Try again in 15 minutes." : "Wrong password."; $("login").hidden = false; $("board").hidden = true; return; }
      key = k; try { sessionStorage.setItem("zol-key", k); } catch (e) {}
      rows = res.rows || [];
      $("sheet").href = res.sheetUrl;
      $("login").hidden = true; $("board").hidden = false; $("actions").hidden = false;
      render();
    }).withFailureHandler((e) => { $("err").textContent = "Couldn't load: " + (e && e.message || e); }).getRows(k);
  }

  function render() {
    // summary
    const by = (g, r) => rows.filter((x) => x["Gender"] === g && (!r || x["Primary role"] === r)).length;
    $("sum").innerHTML = ROLES.map(([r]) => {
      const strong = rows.filter((x) => x["Primary role"] === r && Number(x["Organizer skill (0-7)"]) >= 5).length;
      return `<tr><td><span class="dot" style="background:${color(r)}"></span>${esc(r)}</td><td class="n">${by("Male", r)}</td><td class="n">${by("Female", r)}</td><td class="n">${rows.filter((x) => x["Primary role"] === r).length}</td><td class="n">${strong}</td></tr>`;
    }).join("") + `<tr><td>All players</td><td class="n">${by("Male")}</td><td class="n">${by("Female")}</td><td class="n">${rows.length}</td><td class="n">${rows.filter((x) => Number(x["Organizer skill (0-7)"]) >= 5).length}</td></tr>`;

    $("filters").innerHTML = ["All"].concat(ROLES.map((r) => r[0])).map((r) =>
      `<button type="button" class="chip" data-f="${esc(r)}" aria-pressed="${r === filter}">${esc(r)}</button>`).join("");

    const q = $("q").value.trim().toLowerCase();
    const strongOnly = $("strong").checked;
    let list = rows.filter((x) => (filter === "All" || x["Primary role"] === filter)
      && (!strongOnly || Number(x["Organizer skill (0-7)"]) >= 5)
      && (!q || [x["Name"], x["Surname"], x["Student No"], x["Major"]].join(" ").toLowerCase().includes(q)));
    const sort = $("sort").value;
    const ri = (r) => { const i = ROLES.findIndex((x) => x[0] === r); return i < 0 ? 9 : i; };
    list.sort((a, b) => sort === "org" ? Number(b["Organizer skill (0-7)"]) - Number(a["Organizer skill (0-7)"])
      : sort === "new" ? String(b["Timestamp"]).localeCompare(String(a["Timestamp"]))
      : sort === "name" ? (a["Name"] + a["Surname"]).localeCompare(b["Name"] + b["Surname"])
      : ri(a["Primary role"]) - ri(b["Primary role"]) || Number(b["Organizer skill (0-7)"]) - Number(a["Organizer skill (0-7)"]));

    const card = (x) => {
      const org = Number(x["Organizer skill (0-7)"]) || 0;
      const pct = { "Media · Editing": x["Editing %"], "Media · Shooting": x["Shooting %"], "Organizers": x["Organizing %"], "Finance & Sponsors": x["Finance %"], "Flags": x["Flags %"] };
      const p1 = pct[x["Primary role"]], p2 = pct[x["Second role"]];
      return `<article class="st" style="--role:${color(x["Primary role"])}">
        <div class="st__top"><div style="min-width:0"><div class="st__name">${esc(x["Name"])} ${esc(x["Surname"])}</div>
          <div class="st__meta">${esc(x["Student No"])} · ${esc(x["Major"])} · Year ${esc(x["Year"])}</div></div>
          <span class="org${org >= 5 ? " org--strong" : ""}" title="Organizer score">Org ${org}/7</span></div>
        <div class="st__roles"><span class="pill">${esc(x["Primary role"])}${p1 ? " " + esc(p1) + "%" : ""}</span>
          <span class="pill pill--2" style="--role:${color(x["Second role"])}">${esc(x["Second role"])}${p2 ? " " + esc(p2) + "%" : ""}</span></div>
        <div class="st__extra"><b>Wants:</b> ${esc(x["Would pick"] || "–")} · <b>Hours:</b> ${esc(x["Hours/week"] || "–")}${x["Skills"] ? " · <b>Skills:</b> " + esc(x["Skills"]) : ""}</div>
      </article>`;
    };
    const m = list.filter((x) => x["Gender"] === "Male"), f = list.filter((x) => x["Gender"] === "Female");
    const other = list.filter((x) => x["Gender"] !== "Male" && x["Gender"] !== "Female");
    $("list-m").innerHTML = m.map(card).join("") || '<p class="empty">No one here yet.</p>';
    $("list-f").innerHTML = f.map(card).join("") || '<p class="empty">No one here yet.</p>';
    $("n-m").textContent = m.length + (m.length === 1 ? " student" : " students");
    $("n-f").textContent = f.length + (f.length === 1 ? " student" : " students");
    $("other").textContent = other.length ? other.length + " older entries have no gender saved (played before the gender question was added)." : "";
  }

  $("login").addEventListener("submit", (e) => { e.preventDefault(); load($("key").value.trim()); });
  $("refresh").addEventListener("click", () => load(key));
  $("logout").addEventListener("click", () => { try { sessionStorage.removeItem("zol-key"); } catch (e) {} rows = []; key = ""; $("list-m").innerHTML = ""; $("list-f").innerHTML = ""; $("board").hidden = true; $("actions").hidden = true; $("login").hidden = false; $("key").value = ""; });
  $("filters").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
  ["q", "strong", "sort"].forEach((id) => $(id).addEventListener("input", render));
  if (key) load(key);
})();
</script>
</body>
</html>
